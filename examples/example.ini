; CASE SENSITIVE BY DEFAULT!
[section]
key = value ; COMMENT
key2 = value2 # COMMENT
; both ; and # work for comments.

[settings]
filepath = /tmp/file ; <- correct!
filepath = C:\Users\user\Desktop\file ; <- wrong! "\" acts as an escaper.
filepath = C:\\Users\\user\\Desktop\\file ; <- correct! literal "\"s needs to be escaped as "\\"
; Now, the "filepath" read by the reader is "C:\\Users\\user\\Desktop\\file" (This is parsed as C:\Users\user\Desktop\file)" (The very last definition of a key is read.)
escaped\=key = VALUE ; The key will be "escaped=key" and the value will be "VALUE";
key3 = VALUE \; LATTER ; COMMENT ; The key will be "key3" and the value will be "VALUE ; LATTER"
