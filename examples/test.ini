; ==============================================================================
; Example INI file suitable for INIRW
; ==============================================================================
[SECTION]
key = value # COMMENT!

[settings]
enabled=true ; enabling/disabling the application
interval=10 # interval at which the program will refresh

[adjustables\]] ; (section will be read as "adjustables]")
multiplier=0.0
api\=key="KtEiYa1a2p3i4k" ; (key will be read as "api=key")
